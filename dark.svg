<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc">
  <title id="title">Sakthivel S — Full Stack Developer</title>
  <desc id="desc">Animated terminal-style GitHub profile banner for Sakthivel S.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 58px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC}
      .role{font:500 25px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}
      .mono{font:500 22px 'Cascadia Code','Consolas',monospace}
      .small{font:500 18px 'Cascadia Code','Consolas',monospace;fill:#64748B}
      .cursor{animation:blink 1s steps(2,end) infinite}
      .float{animation:float 4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes float{50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="1800" height="420" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="1794" height="414" rx="26" fill="none" stroke="#1E293B" stroke-width="3"/>
  <circle cx="1640" cy="70" r="150" fill="#7C3AED" opacity=".08"/>
  <circle cx="1740" cy="350" r="190" fill="#22D3EE" opacity=".06"/>
  <path d="M0 385 C420 320 720 450 1120 360 S1550 290 1800 340" fill="none" stroke="#22D3EE" stroke-opacity=".08" stroke-width="2"/>

  <g transform="translate(90 62)">
    <rect width="970" height="292" rx="18" fill="#0D1424" stroke="#243247" stroke-width="2"/>
    <rect width="970" height="48" rx="18" fill="#111B2E"/>
    <rect y="30" width="970" height="18" fill="#111B2E"/>
    <circle cx="25" cy="24" r="7" fill="#EF4444"/>
    <circle cx="48" cy="24" r="7" fill="#F59E0B"/>
    <circle cx="71" cy="24" r="7" fill="#10B981"/>
    <text x="105" y="31" class="small">sakthivel@developer:~</text>

    <text x="38" y="92" class="mono" fill="#10B981">$</text>
    <text x="67" y="92" class="mono" fill="#E2E8F0">whoami</text>
    <text x="38" y="132" class="mono" fill="#22D3EE">Sakthivel S</text>

    <text x="38" y="174" class="mono" fill="#10B981">$</text>
    <text x="67" y="174" class="mono" fill="#E2E8F0">role</text>
    <text x="38" y="214" class="mono" fill="#A78BFA">Full Stack Developer</text>

    <text x="38" y="256" class="mono" fill="#10B981">$</text>
    <text x="67" y="256" class="mono" fill="#E2E8F0">stack</text>
    <text x="150" y="256" class="mono" fill="#F8FAFC">Java • Spring Boot • React • MySQL</text>
    <rect x="107" y="238" width="3" height="25" fill="#22D3EE" class="cursor"/>
  </g>

  <g transform="translate(1120 82)" class="float">
    <text x="0" y="0" class="title">SAKTHIVEL S</text>
    <rect x="2" y="24" width="510" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    <text x="2" y="70" class="role">Full Stack Developer</text>

    <g transform="translate(0 112)">
      <rect width="500" height="112" rx="16" fill="#0D1424" stroke="#243247"/>
      <text x="24" y="35" class="mono" fill="#22D3EE">&lt;developer&gt;</text>
      <text x="24" y="66" class="mono" fill="#94A3B8">build • learn • solve • ship</text>
      <text x="24" y="96" class="mono" fill="#10B981">status: available_to_build</text>
    </g>
  </g>

  <text x="90" y="398" class="small">JAVA  •  SPRING BOOT  •  REACT.JS  •  JAVASCRIPT  •  MYSQL  •  GIT</text>
</svg>